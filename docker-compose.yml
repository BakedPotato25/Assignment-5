version: "3.9"

# Bookstore Microservices — SQLite, no external database

services:

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports: [ "5672:5672", "15672:15672" ]
    networks: [ bookstore-net ]
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports: [ "8000:8000" ]
    volumes:
      - ./api-gateway/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  staff-service:
    build: ./staff-service
    container_name: staff-service
    ports: [ "8001:8000" ]
    volumes:
      - ./staff-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  manager-service:
    build: ./manager-service
    container_name: manager-service
    ports: [ "8002:8000" ]
    volumes:
      - ./manager-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  customer-service:
    build: ./customer-service
    container_name: customer-service
    ports: [ "8003:8000" ]
    volumes:
      - ./customer-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    ports: [ "8004:8000" ]
    volumes:
      - ./catalog-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  book-service:
    build: ./book-service
    container_name: book-service
    ports: [ "8005:8000" ]
    volumes:
      - ./book-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports: [ "8006:8000" ]
    volumes:
      - ./cart-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  order-service:
    build: ./order-service
    container_name: order-service
    ports: [ "8007:8000" ]
    volumes:
      - ./order-service/db.sqlite3:/app/db.sqlite3
    depends_on: [ rabbitmq ]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - BOOKSTORE_EVENT_EXCHANGE=bookstore.events
    networks: [ bookstore-net ]
    restart: unless-stopped

  ship-service:
    build: ./ship-service
    container_name: ship-service
    ports: [ "8008:8000" ]
    volumes:
      - ./ship-service/db.sqlite3:/app/db.sqlite3
    depends_on: [ rabbitmq ]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - BOOKSTORE_EVENT_EXCHANGE=bookstore.events
      - BOOKSTORE_SHIP_QUEUE=ship-service.events
      - ENABLE_EVENT_CONSUMER=1
    networks: [ bookstore-net ]
    restart: unless-stopped

  pay-service:
    build: ./pay-service
    container_name: pay-service
    ports: [ "8009:8000" ]
    volumes:
      - ./pay-service/db.sqlite3:/app/db.sqlite3
    depends_on: [ rabbitmq ]
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - BOOKSTORE_EVENT_EXCHANGE=bookstore.events
      - BOOKSTORE_PAY_QUEUE=pay-service.events
      - ENABLE_EVENT_CONSUMER=1
    networks: [ bookstore-net ]
    restart: unless-stopped

  comment-rate-service:
    build: ./comment-rate-service
    container_name: comment-rate-service
    ports: [ "8010:8000" ]
    volumes:
      - ./comment-rate-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  recommender-ai-service:
    build: ./recommender-ai-service
    container_name: recommender-ai-service
    ports: [ "8011:8000" ]
    volumes:
      - ./recommender-ai-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports: [ "8012:8000" ]
    volumes:
      - ./auth-service/db.sqlite3:/app/db.sqlite3
    networks: [ bookstore-net ]
    restart: unless-stopped

networks:
  bookstore-net:
    driver: bridge
